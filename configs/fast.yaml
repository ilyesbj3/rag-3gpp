# Fast demo profile: same settings as config.yaml except the reranker (bge-reranker-base,
# about 3x faster on CPU, English only) and its calibrated gate. Uses the main index.
#   RAG_CONFIG=configs/fast.yaml uvicorn app.server:app --host 127.0.0.1 --port 8000
data_variant: ""            # reuse data/processed and data/index of the main corpus
corpus:
  specs:
    - {id: "TS 23.501", short: "23.501", version: "18.12.0", release: "Rel-18", file: "23501-ic0.zip",
       url: "https://www.3gpp.org/ftp/Specs/archive/23_series/23.501/23501-ic0.zip"}
    - {id: "TS 24.501", short: "24.501", version: "18.14.0", release: "Rel-18", file: "24501-ie0.zip",
       url: "https://www.3gpp.org/ftp/Specs/archive/24_series/24.501/24501-ie0.zip"}
chunking:
  max_tokens: 800
  overlap_tokens: 100
  min_tokens: 30            # sections below this stay separate chunks (never merged), flagged in stats
embedding:
  model: "BAAI/bge-m3"
  batch_size: 16
  max_seq_length: 1024
qdrant:
  url: "http://localhost:6333"   # set to "" to use local path mode
  path: "data/index/qdrant"
  collection: "3gpp_rel18_bge-m3"
retrieval:
  dense_top_n: 50
  sparse_top_n: 50
  rrf_k: 60
  fused_top_n: 15           # candidates passed to the reranker (benchmark: eval/results/reranker_bench.csv)
  final_top_k: 6            # chunks given to the LLM
  min_per_spec_when_both: 2 # quota for cross-spec questions
  use_hybrid: true
  use_reranker: true
  use_routing: true
  router_version: 2         # 1 = original rules, 2 = mixed architecture/NAS rules
  routing_mode: "soft"      # hard = filter to routed spec(s) | soft = search both, boost routed spec
  soft_routing_weight: 1.5  # RRF multiplier for the routed spec's chunks (soft mode)
  bm25_weight: 0.5          # weight of the BM25 list in RRF (dense = 1); chosen by retrieval MRR
  translate_query_for_bm25: false  # bonus: translate non-English questions for BM25
gate:
  reranker_threshold: 0.15  # calibrated for bge-reranker-base @512 (same sweep, retrieval_best_grid_base_soft_w0.5)
  dense_threshold: 0.55     # calibrated; thin margin (out-of-corpus max 0.559, in-corpus min 0.554)
reranker:
  model: "BAAI/bge-reranker-base"   # English/Chinese only; use config.yaml for French questions
  max_length: 512
llm:
  provider: "auto"          # auto (gemini→groq→grok) | gemini | groq | grok
  temperature: 0
  max_tokens: 8192          # gemini-3.x "thinking" tokens count against this budget
  prompt_version: 2         # 2 = refuse only when no source is relevant (src/generation/prompts.py)
seed: 42
